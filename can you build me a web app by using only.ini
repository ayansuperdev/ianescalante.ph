    🧩 1. System Overview

A login system with a dashboard should allow:

Secure user authentication (Login / Logout)

Role-based access (Admin, User, etc.)

A dashboard that displays data and system status

Settings for user profiles, account management, and system preferences

⚙️ 2. Functional Requirements
🧍 User Account Management

Register / Create Account

Fields: username, email, password, confirm password

Login

Secure form (POST method)

Password hashing using password_hash() in PHP

Logout

Session destroy on click

Forgot Password

Email reset link (optional for later)

Change Password

Form for updating old → new password

🖥️ Dashboard Features

Dynamic Dashboard

Display summary cards (e.g., total users, activities, system logs)

Personalized greeting (“Welcome, Ian!”)

Navigation Menu

Home

Users

Settings

Reports

Logout

Live Data Widgets (optional)

Graphs using Chart.js or ApexCharts

Recent activity table

⚙️ System Settings

Profile Settings

Change username, email, password, profile photo

Theme Settings

Light / Dark mode toggle

System Configuration

Site title, description, timezone

User Roles

Admin (full access)

Staff/User (limited access)

Notifications

Enable/disable notifications or sound alerts

🛡️ 3. Non-Functional Requirements
Category	Description
Security	Password hashing, input sanitization, session handling, CSRF protection
Performance	Fast page load, caching if needed
Usability	Responsive UI for desktop & mobile
Maintainability	Modular code (e.g., separate files for login, dashboard, config)
Scalability	Easily add new modules (reports, analytics, etc.)
🗄️ 4. Database Structure (phpMyAdmin)
Table: users
Field	Type	Description
id	INT (PK, AUTO_INCREMENT)	Unique user ID
username	VARCHAR(100)	Login name
email	VARCHAR(255)	User email
password	VARCHAR(255)	Hashed password
role	ENUM('admin','user')	Access control
profile_pic	VARCHAR(255)	Path to user’s photo
created_at	DATETIME	Account creation date
Table: settings
Field	Type	Description
id	INT	Primary key
site_title	VARCHAR(255)	System title
timezone	VARCHAR(100)	Default timezone
theme	ENUM('light','dark')	UI theme
notifications	TINYINT(1)	On/off
🧰 5. File Structure Example (for Laragon)
/your_project/
│
├── index.php                # Login page
├── dashboard.php            # Dashboard after login
├── settings.php             # System settings
├── logout.php               # Destroys session
│
├── /includes/
│   ├── db_connect.php       # Database connection
│   ├── auth.php             # Authentication checks
│   ├── functions.php        # Common reusable functions
│
├── /assets/
│   ├── /css/style.css       # Styling
│   ├── /js/scripts.js       # Frontend logic
│
└── /uploads/                # Profile pictures

🔐 6. Core Login Flow (PHP)

Login Form → POST to login.php

PHP validates input → fetches user from DB

Use password_verify() for password check

Store session:

$_SESSION['user_id'] = $row['id'];
$_SESSION['role'] = $row['role'];


Redirect to dashboard

Use auth.php in dashboard pages to restrict access

🎨 7. Frontend (UI Design Suggestions)

Login Page:

Centered form, logo, background gradient

Dashboard Layout:

Sidebar (fixed)

Top navigation bar

Main content with cards & tables

Theme Switcher:

Toggle between dark/light using JS and CSS variables

